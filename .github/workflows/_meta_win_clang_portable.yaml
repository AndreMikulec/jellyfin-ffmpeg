on:
  workflow_call:
    inputs:
      release:
        required: false
        default: false
        type: boolean
    secrets:
      deploy-host:
        required: false
      deploy-user:
        required: false
      deploy-key:
        required: false

jobs:
  build:
    name: 'Build Portable FFmpeg'
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - name: CLANG64
            arch: win64
            runner: windows-latest
            msystem: CLANG64
            toolchain: mingw-w64-clang-x86_64-toolchain
            nasm: mingw-w64-clang-x86_64-nasm
            build_script: ./msys2/build.sh
# Andre commented out
#s         - name: CLANGARM64
#s           arch: winarm64
#s           runner: windows-11-arm
#s           msystem: CLANGARM64
#s           toolchain: mingw-w64-clang-aarch64-toolchain
#s           nasm: mingw-w64-clang-aarch64-nasm
#s           build_script: ./msys2/buildarm64.sh


    # OMIT shaderc
    # mingw-w64-clang-x86_64-jellyfin-shaderc-2026.1-1 and mingw-w64-clang-x86_64-shaderc-2026.2-1 are in conflict. Remove mingw-w64-clang-x86_64-shaderc? [Y/n] 
    # error: failed to prepare transaction (could not satisfy dependencies)
    # removing mingw-w64-clang-x86_64-shaderc breaks dependency 'mingw-w64-clang-x86_64-shaderc' required by mingw-w64-clang-x86_64-ffmpeg
    #
    # mingw-w64-clang-x86_64-shaderc
    #
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          update: true
          msystem: ${{ matrix.os.msystem }}
          install: >-
            git
            curl
            wget
            zip
            ${{ matrix.os.toolchain }}
            quilt
            diffstat
            ${{ matrix.os.nasm }}
            mingw-w64-clang-x86_64-brotli
            mingw-w64-clang-x86_64-bzip2
            mingw-w64-clang-x86_64-libiconv
            mingw-w64-clang-x86_64-xz
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-libpng
            mingw-w64-clang-x86_64-fftw
            mingw-w64-clang-x86_64-freetype
            mingw-w64-clang-x86_64-fribidi
            mingw-w64-clang-x86_64-gmp
            mingw-w64-clang-x86_64-libxml2
            mingw-w64-clang-x86_64-chromaprint
            mingw-w64-clang-x86_64-fontconfig
            mingw-w64-clang-x86_64-harfbuzz
            mingw-w64-clang-x86_64-lame
            mingw-w64-clang-x86_64-libbluray
            mingw-w64-clang-x86_64-libogg
            mingw-w64-clang-x86_64-libvpx
            mingw-w64-clang-x86_64-libwebp
            mingw-w64-clang-x86_64-opus
            mingw-w64-clang-x86_64-libunibreak
            mingw-w64-clang-x86_64-libvorbis
            mingw-w64-clang-x86_64-dav1d
            mingw-w64-clang-x86_64-fdk-aac
            mingw-w64-clang-x86_64-libass
            mingw-w64-clang-x86_64-libopenmpt
            mingw-w64-clang-x86_64-libtheora
            mingw-w64-clang-x86_64-opencl-headers
            mingw-w64-clang-x86_64-svt-av1
            mingw-w64-clang-x86_64-x264
            mingw-w64-clang-x86_64-x265
            mingw-w64-clang-x86_64-zimg
            mingw-w64-clang-x86_64-amf-headers
            mingw-w64-clang-x86_64-ffnvcodec-headers
            mingw-w64-clang-x86_64-libvpl
            mingw-w64-clang-x86_64-opencl-icd
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-libplacebo
            mingw-w64-clang-x86_64-spirv-headers

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare prefix dir
        run: |
          mkdir /${{ matrix.os.msystem == 'CLANG64' && 'clang64' || 'clangarm64' }}/ffbuild

      - name: Build Portable
        run: ${{ matrix.os.build_script }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-clang-${{ matrix.os.arch }}-portable
          path: ./msys2/artifacts

      # Andre added
      - name: Upload Artifacts 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-clang-${{ matrix.os.arch }}-shared-portable
          path: ./msys2/artifacts2

