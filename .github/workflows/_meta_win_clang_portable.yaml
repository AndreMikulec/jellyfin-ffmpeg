  build:
    name: 'Build Portable FFmpeg'
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - name: CLANG64
            arch: win64
            runner: windows-latest
            msystem: CLANG64
            toolchain: mingw-w64-clang-x86_64-toolchain
            nasm: mingw-w64-clang-x86_64-nasm
            build_script: ./msys2/build.sh
# Andre commented out
#s         - name: CLANGARM64
#s           arch: winarm64
#s           runner: windows-11-arm
#s           msystem: CLANGARM64
#s           toolchain: mingw-w64-clang-aarch64-toolchain
#s           nasm: mingw-w64-clang-aarch64-nasm
#s           build_script: ./msys2/buildarm64.sh



    # OMIT shaderc
    # mingw-w64-clang-x86_64-jellyfin-shaderc-2026.1-1 and mingw-w64-clang-x86_64-shaderc-2026.2-1 are in conflict. Remove mingw-w64-clang-x86_64-shaderc? [Y/n] 
    # error: failed to prepare transaction (could not satisfy dependencies)
    # removing mingw-w64-clang-x86_64-shaderc breaks dependency 'mingw-w64-clang-x86_64-shaderc' required by mingw-w64-clang-x86_64-ffmpeg
    #
    # mingw-w64-clang-x86_64-shaderc
    # modified PKGBUILD\50-mingw-w64-shaderc from  pkgver=2026.1 to  pkgver=2026.2.
    #
    # Andre added
    # --enable-shared
    # Andre removed - html - requires perl texinfo  - make html
    # --disable-doc
    # Andre removed - requires SDL2
    # --disable-sdl2 \
    # --disable-ffplay \
    #
    # Andre added
    # pacman -S po4a
    # https://packages.msys2.org/search?t=pkg&q=po4a
    # 
    # Supported formats
    # po4a currently supports the following formats:
    # ...
    # It extracts the translatable material from the original document, 
    # and places it into a PO file that is adapted to the translation process. 
    # docbook DocBook XML
    # xhtml XHTML documents
    # dia uncompressed Dia diagrams
    # guide Gentoo Linux's XML documentation format
    # wml WML documents
    # 
    # po4a/update-po The program 'po4a' was not found.
    # po4a/update-po Translated man pages were not generated.
    # Tools for helping translation of documentation
    # https://www.po4a.org/
    #
    # If a user doesn't install "texi2html" package prior to ffmpeg compilation, 
    #  it won't install docs, but there are no warnings during configure process 
    #    and the default is to build ffmpeg with docs.
    # FFmpeg will now create and install documentation based on the tools installed on the system
    #   (so if texi2html is missing, it still will compile and install man pages).
    # 2012 SEEN JUN 2026
    # https://trac.ffmpeg.org/ticket/1449
    #
    # texi2html is deprecated by GNU and replaced by texi2any (provided by the Texinfo package)
    
    defaults:
      run:
        shell: msys2 {0}
    steps:

        # # help "msys2/setup-msys2" find
        #
        # /usr/bin/site_perl/msguntypot
        # /usr/bin/site_perl/po4a
        # /usr/bin/site_perl/po4a-display-man
        # /usr/bin/site_perl/po4a-display-pod
        # /usr/bin/site_perl/po4a-gettextize
        # /usr/bin/site_perl/po4a-normalize
        # /usr/bin/site_perl/po4a-translate
        #
      - name: Add site_perl to GITHUB_PATH
        shell: bash
        run: |
          # Get the exact MSYS2 installation path (translated to a Windows path)
          MSYS_ROOT=$(cygpath -w /)
          # Append the site_perl bin folder (using forward slashes/escaped syntax for Windows)
          echo "${MSYS_ROOT}\usr\\bin\\site_perl" >> ${GITHUB_PATH}
          echo MSYS_ROOT: ${MSYS_ROOT}
          echo GITHUB_PATH: ${GITHUB_PATH}

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          update: true
          path-type: inherit
          msystem: ${{ matrix.os.msystem }}
          install: >-
            git
            curl
            wget
            zip
            ${{ matrix.os.toolchain }}
            quilt
            diffstat
            ${{ matrix.os.nasm }}
            mingw-w64-clang-x86_64-SDL2_image
            mingw-w64-clang-x86_64-SDL2_mixer
            mingw-w64-clang-x86_64-SDL2_pango
            mingw-w64-clang-x86_64-SDL2_sound
            mingw-w64-clang-x86_64-perl
            mingw-w64-clang-x86_64-texinfo
            po4a

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare prefix dir
        run: |
          mkdir /${{ matrix.os.msystem == 'CLANG64' && 'clang64' || 'clangarm64' }}/ffbuild

      - name: Build Portable
        run: ${{ matrix.os.build_script }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-clang-${{ matrix.os.arch }}-portable
          path: ./msys2/artifacts

      # Andre added
      - name: Upload Artifacts 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-clang-${{ matrix.os.arch }}-shared-portable
          path: ./msys2/artifacts2

